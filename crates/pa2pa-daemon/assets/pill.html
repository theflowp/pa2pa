<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--PA2PA_TOKEN_META-->
  <title>pa2pa Pill</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      color: #f1f5ff;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      width: 100%;
      height: 100%;
      padding: 2px;
      background: transparent !important;
    }

    /* Liquid Glass surface shared between card & pill (dense high-contrast frosted glass, zero resize flicker) */
    .glass {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 18% 0%, rgba(165, 192, 255, 0.15) 0%, rgba(165, 192, 255, 0) 56%),
        linear-gradient(
          160deg,
          rgba(28, 34, 50, 0.94) 0%,
          rgba(16, 20, 31, 0.96) 52%,
          rgba(11, 14, 22, 0.98) 100%
        );
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 18px rgba(255, 255, 255, 0.03);
    }
    .glass::before {
      content: "";
      position: absolute;
      inset: 0 10% auto 10%;
      height: 1px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.65) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .card-wrap {
      width: 100%;
      flex-shrink: 0;
      display: none;
      padding-bottom: 8px;
      transform-origin: bottom right;
      will-change: transform, opacity;
      opacity: 0;
      transform: translate3d(0, 18px, 0) scale(0.92);
      transition:
        opacity 0.28s cubic-bezier(0.2, 0.8, 0.2, 1),
        transform 0.44s cubic-bezier(0.22, 1.10, 0.36, 1);
    }
    .card-wrap.mounted {
      display: block;
    }
    .card-wrap.open {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }
    .card-wrap.closing {
      opacity: 0;
      transform: translate3d(0, 14px, 0) scale(0.94);
      transition:
        opacity 0.24s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card {
      width: 100%;
      border-radius: 20px;
      padding: 13px 14px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .peer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.01em;
    }
    .contacts-meta {
      font-weight: 500;
      font-size: 11.5px;
      color: rgba(203, 213, 238, 0.72);
    }
    .tag {
      background: rgba(251, 191, 36, 0.20);
      color: #fbbf24;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid rgba(251, 191, 36, 0.25);
    }
    .reason {
      font-size: 11.5px;
      color: rgba(203, 213, 238, 0.78);
      margin-bottom: 8px;
      line-height: 1.42;
    }
    .reason:last-child {
      margin-bottom: 0;
    }
    .msg-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 2.5px solid #fbbf24;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12.5px;
      line-height: 1.4;
      max-height: 92px;
      overflow-y: auto;
      user-select: text;
      -webkit-user-select: text;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 9px;
    }
    textarea {
      width: 100%;
      height: 52px;
      resize: none;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 11px;
      color: #f3f6ff;
      padding: 7px 9px;
      font-size: 12px;
      font-family: inherit;
      user-select: text;
      -webkit-user-select: text;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.18s ease, background 0.18s ease;
    }
    textarea:focus {
      border-color: rgba(129, 157, 255, 0.8);
      background: rgba(255, 255, 255, 0.10);
    }
    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      outline: none;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      color: #f1f5ff;
      background: rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition:
        transform 0.14s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.18s ease,
        box-shadow 0.18s ease;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }
    button:active {
      transform: scale(0.93) translateZ(0);
      background: rgba(255, 255, 255, 0.22);
    }
    button:focus, button:focus-visible {
      outline: none;
    }
    .btn-good { background: rgba(52, 211, 153, 0.22); color: #5eead4; }
    .btn-good:hover { background: rgba(52, 211, 153, 0.34); }
    .btn-primary { background: rgba(108, 140, 255, 0.90); color: #090d16; }
    .btn-primary:hover { background: rgba(129, 157, 255, 0.96); }
    .btn-danger { background: rgba(248, 113, 113, 0.22); color: #fca5a5; }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.34); }

    .pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      min-width: 248px;
      max-width: 100%;
      padding: 0 8px 0 14px;
      border-radius: 999px;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pill.alert {
      border-color: rgba(251, 191, 36, 0.78);
      box-shadow:
        inset 0 1px 0 rgba(255, 232, 163, 0.40),
        inset 0 0 0 1px rgba(251, 191, 36, 0.35);
    }
    .drag-zone {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      cursor: grab;
      height: 100%;
      min-width: 0;
    }
    .drag-zone:active { cursor: grabbing; }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }
    .dot.ok { background: #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.85); }
    .dot.warn { background: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.9); animation: pulse 1.6s ease-in-out infinite; }
    .dot.err { background: #f87171; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.22); opacity: 0.72; }
    }
    .pill-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill-btns {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      color: rgba(241, 245, 255, 0.92);
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.17);
      border-color: rgba(255, 255, 255, 0.20);
    }
    .icon-btn svg {
      width: 13px;
      height: 13px;
      display: block;
      pointer-events: none;
    }
    .min-btn {
      width: 24px;
      height: 24px;
    }
    .min-btn svg {
      width: 12px;
      height: 12px;
    }
    #chevron-icon {
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      transform: rotate(0deg);
    }
    #toggle-btn.is-open #chevron-icon {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="card-wrap" class="card-wrap">
      <div id="card" class="card glass"></div>
    </div>

    <div id="pill" class="pill glass">
      <div class="drag-zone" id="drag-zone" title="Drag pill · Double-click to toggle">
        <span id="dot" class="dot"></span>
        <span id="pill-text" class="pill-title">pa2pa · connecting…</span>
      </div>
      <div class="pill-btns">
        <button class="icon-btn" id="toggle-btn" type="button" title="Expand / Collapse" data-action="toggle">
          <svg id="chevron-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 10l4-4 4 4"/>
          </svg>
        </button>
        <button class="icon-btn" type="button" title="Open Web Dashboard" data-action="open-dashboard">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 11L11 5M6.5 5H11v4.5"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_TOKEN = document.querySelector('meta[name="pa2pa-token"]')?.content || '';
    const MINUS_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h8"/></svg>';
    const PREV_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg>';
    const NEXT_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>';

    let expanded = false;
    let animGen = 0;
    let collapseTimer = null;
    let statusData = null;
    let pendingApprovals = [];
    let activeIdx = 0;
    let lastApprovalCount = 0;

    function apiFetch(path, opts = {}) {
      const headers = Object.assign({ 'X-Pa2pa-Token': API_TOKEN }, opts.headers || {});
      return fetch(path, Object.assign({}, opts, { headers }));
    }

    function postIpc(payload) {
      if (window.ipc && typeof window.ipc.postMessage === 'function') {
        window.ipc.postMessage(JSON.stringify(payload));
      }
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function measureExpandedHeight() {
      const wrap = document.getElementById('card-wrap');
      // Always guarantee generous room for the card + fixed 44px pill + shell padding so the pill never compresses.
      const cardH = Math.ceil(wrap.getBoundingClientRect().height || wrap.offsetHeight || 96);
      return cardH + 44 + 16;
    }

    let openTimer = null;

    function setExpanded(next) {
      if (next === expanded) return;
      expanded = next;
      animGen += 1;
      const gen = animGen;
      if (collapseTimer) {
        clearTimeout(collapseTimer);
        collapseTimer = null;
      }
      if (openTimer) {
        clearTimeout(openTimer);
        openTimer = null;
      }

      const wrap = document.getElementById('card-wrap');
      const toggleBtn = document.getElementById('toggle-btn');
      toggleBtn.classList.toggle('is-open', expanded);

      if (expanded) {
        renderCardContent();
        wrap.classList.remove('closing', 'open');
        wrap.classList.add('mounted');

        // Size NSWindow ONCE with ample headroom (extra transparent pixels above the card are invisible),
        // let WKWebView settle its backing surface for 35ms while card is invisible, then play the
        // uninterrupted spring entrance animation at full 60/120fps.
        const targetH = pendingApprovals.length > 0
          ? Math.max(measureExpandedHeight(), 360)
          : Math.max(measureExpandedHeight(), 164);
        postIpc({ type: 'resize', expanded: true, height: targetH });

        openTimer = setTimeout(() => {
          if (gen !== animGen || !expanded) return;
          requestAnimationFrame(() => {
            if (gen !== animGen || !expanded) return;
            wrap.classList.add('open');
          });
        }, 35);
      } else {
        // Play the full smooth collapse transition first, then shrink NSWindow atomically.
        wrap.classList.remove('open');
        wrap.classList.add('closing');
        collapseTimer = setTimeout(() => {
          if (gen !== animGen || expanded) return;
          wrap.classList.remove('mounted', 'closing');
          postIpc({ type: 'resize', expanded: false });
        }, 290);
      }
    }

    function toggleExpand() {
      setExpanded(!expanded);
    }

    function openDashboard() {
      if (window.ipc) {
        postIpc({ type: 'open_dashboard' });
      } else {
        window.open('/', '_blank');
      }
    }

    document.getElementById('drag-zone').addEventListener('mousedown', (e) => {
      if (e.detail === 2) {
        toggleExpand();
        return;
      }
      postIpc({ type: 'drag' });
    });

    async function fetchState() {
      try {
        const [stRes, apRes] = await Promise.all([
          apiFetch('/api/status'),
          apiFetch('/api/approvals?status=pending')
        ]);
        statusData = await stRes.json();
        const apJson = await apRes.json();
        pendingApprovals = apJson.approvals || [];

        if (pendingApprovals.length > lastApprovalCount && !expanded) {
          setExpanded(true);
        }
        lastApprovalCount = pendingApprovals.length;
        if (activeIdx >= pendingApprovals.length) activeIdx = 0;

        renderPill();
        if (expanded) {
          renderCardContent();
          requestAnimationFrame(() => {
            if (!expanded) return;
            postIpc({ type: 'resize', expanded: true, height: measureExpandedHeight() });
          });
        }
      } catch (e) {
        document.getElementById('dot').className = 'dot err';
        document.getElementById('pill-text').textContent = 'pa2pa · daemon offline';
      }
    }

    function renderPill() {
      const dot = document.getElementById('dot');
      const txt = document.getElementById('pill-text');
      const pill = document.getElementById('pill');
      if (!statusData) return;

      const thinkingEntries = Object.keys(statusData.thinking_peers || {});
      const onlineCount = (statusData.online_peers || []).length;
      const isOnline = Boolean(statusData.p2p_ready || statusData.relay_connected);
      const outboxCount = Number(statusData.pending_outbox || 0);
      if (pendingApprovals.length > 0) {
        dot.className = 'dot warn';
        pill.classList.add('alert');
        txt.textContent = `${pendingApprovals.length} approval${pendingApprovals.length > 1 ? 's' : ''} · @${pendingApprovals[0].peer_alias}`;
      } else if (thinkingEntries.length > 0) {
        dot.className = 'dot ok';
        pill.classList.remove('alert');
        txt.textContent = `⏳ @${thinkingEntries[0]} thinking…`;
      } else if (isOnline) {
        dot.className = 'dot ok';
        pill.classList.remove('alert');
        const modeLabel = statusData.p2p_ready && !statusData.relay_connected ? 'P2P' : 'online';
        if (statusData.unread_messages > 0) {
          txt.textContent = `${statusData.unread_messages} unread · @${statusData.name}`;
        } else if (outboxCount > 0) {
          txt.textContent = `${outboxCount} queued · @${statusData.name} (${modeLabel})`;
        } else {
          txt.textContent = `pa2pa · @${statusData.name} (${modeLabel}${onlineCount > 0 ? ' · ' + onlineCount : ''})`;
        }
      } else {
        dot.className = 'dot err';
        pill.classList.remove('alert');
        txt.textContent = `pa2pa · offline`;
      }
      postIpc({
        type: 'status',
        relay_connected: isOnline,
        pending_approvals: pendingApprovals.length,
        unread_messages: Number(statusData.unread_messages || 0),
        online_peers: onlineCount,
      });
    }

    function renderCardContent() {
      const card = document.getElementById('card');
      if (pendingApprovals.length === 0) {
        const n = Number(statusData?.contacts_count || 0);
        const contactsLabel = `${n} contact${n > 1 ? 's' : ''}`;
        card.innerHTML = `
          <div class="card-head">
            <span class="peer-badge">
              @${esc(statusData?.name || 'pa2pa')}
              <span class="contacts-meta">${contactsLabel}</span>
            </span>
            <button class="icon-btn min-btn" type="button" data-action="minimize" title="Minimize">${MINUS_SVG}</button>
          </div>
          <div class="reason">No pending approvals. Your personal agent is standing by (${esc(statusData?.default_runner || 'claude')}).</div>
        `;
        return;
      }

      const ap = pendingApprovals[activeIdx];
      card.innerHTML = `
        <div class="card-head">
          <span class="peer-badge">@${esc(ap.peer_alias)} <span class="tag">Approval ${activeIdx + 1}/${pendingApprovals.length}</span></span>
          <div style="display:flex;gap:4px">
            ${pendingApprovals.length > 1 ? `<button class="icon-btn min-btn" type="button" data-action="cycle" data-delta="-1">${PREV_SVG}</button><button class="icon-btn min-btn" type="button" data-action="cycle" data-delta="1">${NEXT_SVG}</button>` : ''}
            <button class="icon-btn min-btn" type="button" data-action="minimize" title="Minimize">${MINUS_SVG}</button>
          </div>
        </div>
        <div class="reason">${esc(ap.reason)}</div>
        <div class="msg-box">${esc(ap.peer_message)}</div>
        <textarea id="pill-reply" placeholder="Optional custom reply...">${esc(ap.proposed_reply || '')}</textarea>
        <div class="actions">
          <button class="btn-good" type="button" data-action="decide" data-id="${esc(ap.id)}" data-mode="run_agent">Run Agent</button>
          <button class="btn-primary" type="button" data-action="decide" data-id="${esc(ap.id)}" data-mode="reply">Send Reply</button>
          <button class="btn-danger" type="button" data-action="deny" data-id="${esc(ap.id)}">Deny</button>
          <button type="button" data-action="open-dashboard">Details</button>
        </div>
      `;
    }

    function cycleApproval(delta) {
      activeIdx = (activeIdx + delta + pendingApprovals.length) % pendingApprovals.length;
      renderCardContent();
      requestAnimationFrame(() => {
        if (!expanded) return;
        postIpc({ type: 'resize', expanded: true, height: measureExpandedHeight() });
      });
    }

    async function decide(id, mode) {
      const reply = document.getElementById('pill-reply')?.value || '';
      document.getElementById('pill-text').textContent = mode === 'run_agent' ? 'Running agent…' : 'Sending…';
      try {
        await apiFetch(`/api/approvals/${encodeURIComponent(id)}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode, reply, execution_mode: 'read-only' }),
        });
        await fetchState();
        if (pendingApprovals.length === 0) setExpanded(false);
      } catch (e) {
        console.error(e);
      }
    }

    async function deny(id) {
      try {
        await apiFetch(`/api/approvals/${encodeURIComponent(id)}/deny`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notify_peer: true }),
        });
        await fetchState();
        if (pendingApprovals.length === 0) setExpanded(false);
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'toggle') toggleExpand();
      else if (action === 'decide') decide(el.dataset.id, el.dataset.mode);
      else if (action === 'deny') deny(el.dataset.id);
      else if (action === 'cycle') cycleApproval(Number(el.dataset.delta || 0));
      else if (action === 'open-dashboard') openDashboard();
      else if (action === 'minimize') setExpanded(false);
    });

    const es = new EventSource('/api/events?token=' + encodeURIComponent(API_TOKEN));
    ['refresh', 'approval', 'message'].forEach(ev => es.addEventListener(ev, () => fetchState()));
    fetchState();
  </script>
</body>
</html>
