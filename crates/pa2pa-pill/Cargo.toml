[package]
name = "pa2pa-pill"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pa2pa-pill"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
global-hotkey = "0.6"
open.workspace = true
serde.workspace = true
serde_json.workspace = true
tao = "0.30"
tray-icon = "0.19"
wry = { version = "0.47", features = ["transparent"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry", "objc2-core-foundation"] }
